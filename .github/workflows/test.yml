name: Test
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
