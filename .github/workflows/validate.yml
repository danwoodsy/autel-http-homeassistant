name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  test:
    name: Tests and lint
    uses: ./.github/workflows/test.yml

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Validate HACS requirements
        uses: hacs/action@main
        with:
          category: integration
          comment: 'false'

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate Home Assistant integration
        uses: home-assistant/actions/hassfest@master
